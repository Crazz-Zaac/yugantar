name: Publish release images

# Build the backend and frontend images and push them to the GitHub
# Container Registry (GHCR) on every version tag, e.g. `git tag v1.2.3`.
# Also runnable by hand from the Actions tab with an explicit version.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.2.3"
        required: true

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to GHCR

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: docker/Dockerfile.backend
            build_args: ""
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            # Relative API base: the frontend's nginx proxies /api to the backend
            build_args: |
              VITE_API_BASE=/api/v1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image name + tags. On a tag push it reads the semver from the
      # tag; on a manual run it uses the `version` input. Image names are
      # lower-cased automatically (GHCR requires lower case).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yugantar-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
